# Strict typing on the road to Platinum, as in Roomba+.
#
# --strict with nothing switched off. The code inherited from denon_avr
# 1.1.2 starts at 94 errors; scripts/check_typing_baseline.py holds that
# number as a ratchet, and the target is zero.

[mypy]
# 3.14, the Python that Home Assistant 2026.8 (the supported minimum)
# requires.
python_version = 3.14
strict = True
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True

[mypy-tests.*]
ignore_errors = True

# Home Assistant does not declare __all__ in its component modules, so
# --strict's no-implicit-reexport rule would flag every import from them.
# Scoped to Home Assistant: our own re-exports stay checked.
[mypy-homeassistant.*]
implicit_reexport = True
