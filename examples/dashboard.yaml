# Denon AVR Plus – an example dashboard view.
#
# Paste it as a view in a dashboard's raw configuration editor and replace
# avr_x2600h with your receiver's entity ids. Receivers set up before 0.9.3
# call the network music switches switch.<receiver>_music. It uses only the cards and card
# features of Home Assistant, no custom cards:
# - the media control card, which paints the cover (or the artwork of the
#   input) as its background;
# - tile cards with the media player features (source, sound mode, volume,
#   playback) and select options as buttons for the quick selects;
# - the tuner, shown only while it plays (its preset is unknown otherwise);
# - the activities as buttons, once the zone has activities (Configure →
#   Activities), and the speech clarity switch.
#
# With a linked player (Configure → Playback, for example an Apple TV on its
# input), the same cards show what that player plays, and their play, pause
# and skip buttons control it; power, volume and the input stay the
# receiver's. Nothing to change here for that.
title: Receiver
path: receiver
icon: mdi:audio-video
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Living room
      - type: media-control
        entity: media_player.avr_x2600h
      - type: tile
        entity: media_player.avr_x2600h
        name: Receiver
        vertical: false
        features_position: bottom
        features:
          - type: media-player-volume-slider
          - type: media-player-playback
          - type: media-player-source
          - type: media-player-sound-mode
      - type: tile
        entity: select.avr_x2600h_quick_select
        name: Quick select
        features_position: bottom
        features:
          - type: select-options
            style: buttons
      # Only once the main zone has activities; remove it otherwise.
      - type: tile
        entity: select.avr_x2600h_activity
        name: Activity
        features_position: bottom
        features:
          - type: select-options
            style: buttons
      - type: tile
        entity: switch.avr_x2600h_speech_clarity
        name: Speech clarity
      - type: tile
        entity: number.avr_x2600h_volume
        name: Volume (dB)
      - type: tile
        entity: switch.avr_x2600h_network_music
        name: Network music
  # The tuner entities start disabled: enable "Tuner preset" and "Tuner
  # frequency" on the device page to use this section.
  - type: grid
    visibility:
      - condition: state
        entity: select.avr_x2600h_tuner_preset
        state_not:
          - unknown
          - unavailable
    cards:
      - type: heading
        heading: Tuner
      - type: tile
        entity: select.avr_x2600h_tuner_preset
        name: Preset
        features_position: bottom
        features:
          - type: select-options
      - type: tile
        entity: number.avr_x2600h_tuner_frequency
        name: FM frequency
  - type: grid
    cards:
      - type: heading
        heading: Zone 2
      - type: tile
        entity: media_player.avr_x2600h_zone_2
        name: Zone 2
        features_position: bottom
        features:
          - type: media-player-volume-buttons
          - type: media-player-source
      - type: tile
        entity: switch.avr_x2600h_zone_2_network_music
        name: Network music in zone 2
