# Home Assistant integration quality scale, tracked as in Roomba+.
#
# The scale is defined for core integrations and nobody grades a custom
# integration, so this file is a self-assessment. It is kept honest: a rule
# is `done` only when the code does it today. `todo` comments name the
# package of the roadmap that closes the gap.
#
# State at the start of the project (code of denon_avr 1.1.2): Bronze is
# not complete yet (config-flow field descriptions, removal docs, config
# flow tests).
rules:
  # ── Bronze ────────────────────────────────────────────────────────────────
  action-setup:
    status: done
    comment: send_command is registered in async_setup (services.py).
  appropriate-polling:
    status: done
    comment: >
      State is pushed over telnet. An HTTP reconciliation poll runs every
      60 s (an option, 30 to 600 s), every 10 s only while telnet is down.
      The setup API menus are read when the link comes up, after own
      writes and every 15 minutes (an option; 0 for never).
  brands:
    status: done
    comment: Brand images ship in the inline brand/ directory.
  common-modules:
    status: done
    comment: >
      Base entity in entity.py, push coordinator in coordinator.py, the
      receiver client without Home Assistant in avr/.
  config-flow:
    status: done
    comment: >
      User, SSDP and reconfigure steps, with a data_description for the host
      field.
  config-flow-test-coverage:
    status: done
  dependency-transparency:
    status: done
    comment: No external Python requirements; the client lives in avr/.
  docs-actions:
    status: done
    comment: README, section Actions.
  docs-configuration-parameters:
    status: done
    comment: README, section Options (volume, zones, sources, sound modes, connection).
  docs-installation-instructions:
    status: done
  docs-installation-parameters:
    status: done
    comment: The only parameter is the receiver's IP address (README).
  docs-removal-instructions:
    status: done
    comment: README, section "Removal".
  entity-event-setup:
    status: done
    comment: Entities subscribe through CoordinatorEntity.
  entity-unique-id:
    status: done
    comment: MAC address (else serial number) plus a stable key.
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-setup:
    status: done
    comment: An unreachable receiver raises ConfigEntryNotReady.
  unique-config-entry:
    status: done
    comment: Unique id is the MAC address; without one, the host is matched.

  # ── Silver ────────────────────────────────────────────────────────────────
  action-exceptions:
    status: done
    comment: >
      Every entity action is wrapped (entity.receiver_action): a setup API
      write the receiver rejects and a command that reaches the receiver
      neither over telnet nor over HTTP raise a translated error.
      send_command raises its own translated errors.
  config-entry-unloading:
    status: done
  docs-supported-functions:
    status: done
  entity-translations:
    status: done
  entity-unavailable:
    status: done
    comment: >
      Entities follow the telnet link. The HTTP fallback state is never
      shown while telnet is down; making the media player stay available
      with it is planned.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: >
      A telnet outage longer than five minutes is logged once as a warning,
      with the likely cause; the return of the connection is logged once.
      Shorter drops stay quiet.
  parallel-updates:
    status: done
    comment: >
      0 for the read-only platforms and the media player (telnet commands
      queue in the client); 1 for switch, number, select and button, which
      may write the setup interface.
  reauthentication-flow:
    status: exempt
    comment: The receiver has no authentication.
  test-coverage:
    status: done
    comment: >
      Every module is at 95 % line coverage or above, checked per module in
      CI (scripts/check_coverage_per_module.py); no module is held on a floor.

  # ── Gold ──────────────────────────────────────────────────────────────────
  devices:
    status: done
  diagnostics:
    status: done
    comment: >
      MAC address and serial number redacted, host address not included.
  discovery:
    status: done
    comment: >
      SSDP for Denon and Marantz under AiosDevice, MediaRenderer and
      MediaServer, HEOS speakers skipped; the setup dialog lists the receivers
      SSDP has seen.
  discovery-update-info:
    status: done
    comment: >
      A receiver found again over SSDP, or seen under a new address by DHCP
      (registered devices only), updates the stored host.
  docs-data-update:
    status: done
  docs-examples:
    status: done
    comment: >
      Blueprints, an example dashboard and automation examples in the user
      guide (docs/USER_GUIDE.md, section 6).
  docs-high-level-description:
    status: done
  docs-known-limitations:
    status: done
  docs-supported-devices:
    status: done
    comment: README table of confirmed and expected series.
  docs-troubleshooting:
    status: done
    comment: Symptom, cause and fix table in docs/USER_GUIDE.md, section 10.
  docs-use-cases:
    status: done
    comment: >
      Everyday use, automations and Music Assistant in the user guide
      (sections 4, 6 and 9).
  dynamic-devices:
    status: exempt
    comment: Zones and sub-devices are fixed per receiver.
  entity-category:
    status: done
  entity-device-class:
    status: done
    comment: >
      Connectivity, receiver, distance, sound pressure (volume) and duration
      (sleep timer, audio delay). Levels in dB relative to a reference (tone,
      trims, graphic EQ) and the text sensors have no fitting class.
  entity-disabled-by-default:
    status: done
    comment: >-
      Only everyday controls start enabled (helpers._EVERYDAY_CONTROLS); setup
      values, the graphic EQ and fast-changing signal sensors start disabled.
  exception-translations:
    status: done
    comment: Every raised error has a translation key, in all eight languages.
  icon-translations:
    status: done
    comment: >-
      Every entity names its icon in icons.json, mute and power with state
      icons; scripts/check_icons.py keeps it that way.
  reconfiguration-flow:
    status: done
  repair-issues:
    status: done
    comment: >
      A repair appears when the receiver answers over HTTP but its telnet
      port stays closed for five minutes (session held by another program,
      or port 23 blocked). It clears itself once the connection is back.
      A receiver that does not answer at all is only logged, since being off
      without network standby can be intended.
      A model not checked before gets a fixable repair that runs the
      capability check; afterwards a repair links to a prefilled GitHub issue.
  stale-devices:
    status: exempt
    comment: One receiver per config entry; its sub-devices are fixed.

  # ── Platinum ─────────────────────────────────────────────────────────────
  async-dependency:
    status: done
    comment: The avr/ client is asyncio throughout.
  inject-websession:
    status: done
    comment: Home Assistant's aiohttp session is passed to the client.
  test-before-configure:
    status: done
    comment: The config flow fetches the receiver's device info before creating the entry.
  strict-typing:
    status: done
    comment: >
      mypy --strict passes with nothing switched off; the baseline in
      scripts/check_typing_baseline.py is 0 and may not rise.
