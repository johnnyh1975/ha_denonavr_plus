send_command:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
  fields:
    command:
      required: true
      example: "PSDYNEQ ON"
      selector:
        text:
store_tuner_preset:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
  fields:
    preset:
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 56
          mode: box
snapshot:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
restore:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
get_queue:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
remove_from_queue:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
  fields:
    queue_ids:
      required: true
      example: "[2, 3]"
      selector:
        object: {}
move_queue_item:
  target:
    entity:
      integration: denonavr_plus
      domain: media_player
  fields:
    queue_ids:
      required: true
      example: "[4]"
      selector:
        object: {}
    destination:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 1000
          mode: box
