name: Feature request
description: Something the integration should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: The task you want to achieve, not only the control you are missing.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Receiver model
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Protocol details (optional)
      description: If you know the telnet command or the setting in the receiver's setup menu, name it here.
