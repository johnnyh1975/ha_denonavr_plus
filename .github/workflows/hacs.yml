# HACS validation, in its own workflow so it can carry a README badge.
#
# GitHub's badge endpoint addresses workflows, not jobs, so a check inside
# validate.yml would be invisible from the front page. hassfest.yml and
# typing.yml exist for the same reason (same layout as Roomba+).
name: HACS

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
